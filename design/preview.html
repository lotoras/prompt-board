<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prompt-board preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --surface: rgb(255 255 255 / 0.035);
  --surface-2: rgb(255 255 255 / 0.06);
  --surface-3: rgb(255 255 255 / 0.1);
  --border: rgb(255 255 255 / 0.08);
  --border-strong: rgb(255 255 255 / 0.14);
  --input: rgb(255 255 255 / 0.11);
  --text: #f5f5f5;
  --text-2: #d6d6d6;
  --muted: #a3a3a3;
  --faint: #6b6b6b;
  --primary: oklch(0.571 0.21 264);
  --primary-soft: oklch(0.571 0.21 264 / 0.16);
  --primary-line: oklch(0.571 0.21 264 / 0.55);
  --primary-text: oklch(0.76 0.13 264);
  --attention: #f0a51e;
  --attention-soft: rgb(240 165 30 / 0.12);
  --attention-line: rgb(240 165 30 / 0.4);
  --ok: #10b981;
  --err: #ef4444;
  --idle: #737373;
  /* model + effort hues, shared with the user's terminal statusline */
  --m-opus: #ff2a6d;
  --m-fable: #b967ff;
  --m-sonnet: #05d9e8;
  --m-haiku: #01ffc3;
  --e-low: #6f5c92;
  --e-medium: #05d9e8;
  --e-high: #b967ff;
  --e-xhigh: #d300c5;
  --e-max: #ff2a6d;
  --elevated: color-mix(in oklab, #000, #fff 6%);
  --radius: 8px;
  --font: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--font);
  font-feature-settings: "cv11", "ss03";
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 13px; height: 13px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100vh; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------- sidebar ---------- */
.sidebar { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 14px; border-bottom: 1px solid var(--border); }
.brand-mark { display: grid; grid-template-columns: 5px 5px; gap: 2px; }
.brand-mark i { width: 5px; height: 5px; border-radius: 1.5px; background: var(--faint); }
.brand-mark i:nth-child(1) { background: var(--primary); }
.brand-mark i:nth-child(4) { background: var(--attention); }
.brand-name { font-weight: 600; letter-spacing: -0.01em; }
.brand .close-side { margin-left: auto; display: none; }
.side-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
.new-chat { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); color: var(--text); margin-bottom: 10px; }
.new-chat:hover { background: var(--surface-2); }
.kbd { margin-left: auto; font-size: 11px; color: var(--faint); }
.nav-item, .proj { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--muted); text-align: left; }
.nav-item:hover, .proj:hover { background: var(--surface); color: var(--text); }
.nav-item.on, .proj.on { background: var(--surface-2); color: var(--text); }
.nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--faint); }
.nav-item .count.hot { color: var(--attention); }
.side-label { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 4px; color: var(--faint); font-size: 11.5px; }
.side-label button { color: var(--faint); border-radius: 5px; padding: 2px; display: grid; }
.side-label button:hover { color: var(--text); background: var(--surface-2); }
.proj-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .meta { font-size: 11.5px; color: var(--faint); }
.proj .edit { display: none; color: var(--faint); }
.proj:hover .meta { display: none; }
.proj:hover .edit { display: grid; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.none { background: transparent; }
.dot.busy { background: var(--primary); animation: pulse 2s ease-in-out infinite; }
.dot.attention { background: var(--attention); box-shadow: 0 0 0 3px var(--attention-soft); }
.dot.idle { border: 1.5px solid var(--idle); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 oklch(0.571 0.21 264 / 0.5); } 50% { box-shadow: 0 0 0 4px oklch(0.571 0.21 264 / 0); } }
.side-foot { display: flex; align-items: center; gap: 4px; padding: 8px; border-top: 1px solid var(--border); }
.foot-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--muted); font-size: 12px; }
.foot-btn:hover { background: var(--surface-2); color: var(--text); }
.foot-btn .ok { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.side-foot .spacer { flex: 1; }

/* ---------- tabs ---------- */
.tabs { display: flex; align-items: stretch; height: 40px; border-bottom: 1px solid var(--border); flex: none; }
.tabs-scroll { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.menu-btn { display: none; width: 40px; place-items: center; color: var(--muted); border-right: 1px solid var(--border); flex: none; }
.tab { display: flex; align-items: center; gap: 8px; max-width: 230px; padding: 0 8px 0 12px; border-right: 1px solid var(--border); color: var(--muted); font-size: 12.5px; white-space: nowrap; flex: none; position: relative; }
.tab:hover { color: var(--text); background: var(--surface); }
.tab.on { color: var(--text); background: var(--surface-2); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--primary); }
.tab-title { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tab .dot-btn { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; flex: none; }
.tab .dot-btn:hover { background: var(--surface-3); }
.tab .x { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: var(--faint); visibility: hidden; flex: none; }
.tab:hover .x, .tab.on .x { visibility: visible; }
.tab .x:hover { background: var(--surface-3); color: var(--text); }
.tab .ext { color: var(--faint); display: grid; }
.tab.board { padding-right: 12px; }
.tab.board .badge { font-size: 11px; color: var(--faint); }
.tab-add { display: grid; place-items: center; width: 40px; color: var(--muted); flex: none; }
.tab-add:hover { color: var(--text); background: var(--surface); }

/* ---------- view + chat ---------- */
.view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; min-width: 0; }
.chat-title { font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; color: var(--muted); background: var(--surface-2); flex: none; }
.pill.busy { color: var(--primary-text); background: var(--primary-soft); }
.pill.attention { color: var(--attention); background: var(--attention-soft); }
.head-spacer { flex: 1; }
.head-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; color: var(--muted); font-size: 12px; max-width: 260px; flex: none; }
.head-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head-chip:hover { background: var(--surface-2); color: var(--text); }
.head-meta { color: var(--faint); font-size: 12px; white-space: nowrap; flex: none; }
.ghost-btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 7px; color: var(--text-2); font-size: 12px; flex: none; }
.ghost-btn:hover { background: var(--surface-2); color: var(--text); }

.messages { flex: 1; overflow-y: auto; min-height: 0; }
.stream { max-width: 768px; margin: 0 auto; padding: 28px 24px 18px; display: flex; flex-direction: column; gap: 18px; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
.empty h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
.empty p { margin: 0 auto; color: var(--muted); max-width: 46ch; font-size: 13.5px; }
.empty .path { font-family: var(--mono); font-size: 12px; color: var(--text-2); }

.u-row { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bubble { max-width: min(85%, 620px); background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: 14px; line-height: 1.55; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
.u-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.d-chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; color: var(--primary-text); background: var(--primary-soft); }
.a-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 4px; border-radius: 7px; border: 1px solid var(--border); font-size: 12px; color: var(--text-2); background: var(--surface); }
.a-chip .thumb { width: 18px; height: 18px; border-radius: 4px; background: var(--surface-3) center/cover no-repeat; display: grid; place-items: center; color: var(--muted); }
.a-chip .size { color: var(--faint); }

.md { font-size: 14.5px; line-height: 1.65; color: var(--text-2); }
.md p { margin: 0 0 10px; }
.md p:last-child, .md ul:last-child { margin-bottom: 0; }
.md ul { margin: 0 0 10px; padding-left: 20px; }
.md li { margin: 3px 0; }
.md strong { color: var(--text); font-weight: 600; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border-radius: 4px; padding: 1px 5px; color: var(--text); }
.md pre { margin: 0 0 10px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.55; color: var(--text-2); }
.caret { display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--primary-text); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.worklog { border-radius: var(--radius); }
.wl-toggle { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px 0 6px; margin-left: -6px; border-radius: 7px; color: var(--muted); font-size: 12.5px; }
.wl-toggle:hover { background: var(--surface-2); color: var(--text); }
.wl-toggle .chev { transition: transform 0.15s; }
.worklog.open .wl-toggle .chev { transform: rotate(90deg); }
.wl-toggle .steps { color: var(--faint); }
.wl-toggle .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--primary-soft); border-top-color: var(--primary-text); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.wl-list { display: none; margin: 6px 0 0 1px; padding-left: 14px; border-left: 1px solid var(--border); }
.worklog.open .wl-list { display: block; }
.wl-step { display: flex; align-items: center; gap: 8px; min-height: 26px; color: var(--muted); font-size: 12.5px; }
.wl-step .verb { color: var(--muted); flex: none; }
.wl-step .target { font-family: var(--mono); font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wl-step .meta { margin-left: auto; padding-left: 12px; font-size: 11.5px; color: var(--faint); white-space: nowrap; flex: none; }
.wl-step .meta.ok { color: var(--ok); }
.wl-step.fresh { animation: appear 0.25s ease-out; }
@keyframes appear { from { opacity: 0; transform: translateY(2px); } }
.add { color: var(--ok); }
.del { color: var(--err); }

.card-x { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
.cx-head { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; font-size: 12.5px; color: var(--muted); }
.cx-head .path { font-family: var(--mono); font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cx-head .right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; flex: none; }
.diff { border-top: 1px solid var(--border); font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow-x: auto; }
.dl { display: grid; grid-template-columns: 44px 16px 1fr; white-space: pre; }
.dl .n { color: var(--faint); text-align: right; padding-right: 8px; user-select: none; }
.dl .s { color: var(--faint); user-select: none; }
.dl.a { background: rgb(16 185 129 / 0.09); }
.dl.a .s, .dl.a .c { color: #9ff0cf; }
.dl.d { background: rgb(239 68 68 / 0.09); }
.dl.d .s, .dl.d .c { color: #ffc2c2; }
.dl .c { color: var(--text-2); padding-right: 14px; }
.agent-body { border-top: 1px solid var(--border); padding: 10px 12px 12px; font-size: 13px; color: var(--muted); line-height: 1.55; }
.agent-name { color: var(--text); font-weight: 500; }
.okc { color: var(--ok); display: grid; }

.ask { border: 1px solid var(--attention-line); border-radius: 12px; background: linear-gradient(var(--attention-soft), var(--attention-soft)) , var(--bg); }
.ask .cx-head { color: var(--attention); }
.ask-q { padding: 0 14px 8px; font-size: 14.5px; font-weight: 500; color: var(--text); }
.ask-opts { display: flex; flex-direction: column; gap: 6px; padding: 4px 10px 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: rgb(0 0 0 / 0.35); }
.opt:hover { border-color: var(--border-strong); }
.opt.on { border-color: var(--attention-line); background: rgb(240 165 30 / 0.08); }
.radio { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--faint); margin-top: 2px; flex: none; display: grid; place-items: center; }
.opt.on .radio { border-color: var(--attention); }
.opt.on .radio::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--attention); }
.opt-label { color: var(--text); font-size: 13px; }
.opt-desc { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.ask-other { margin: 0 10px; width: calc(100% - 20px); height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: rgb(0 0 0 / 0.35); color: var(--text); }
.ask-other::placeholder { color: var(--faint); }
.card-foot { display: flex; align-items: center; gap: 8px; padding: 10px 10px 12px; }
.card-foot .spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500; }
.btn.primary { background: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.amber { background: var(--attention); color: #1a1000; }
.btn.amber:hover { filter: brightness(1.08); }
.btn.quiet { color: var(--muted); }
.btn.quiet:hover { color: var(--text); background: var(--surface-2); }
.btn.outline { border: 1px solid var(--border-strong); color: var(--text-2); }
.btn.outline:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: #ff8a8a; }
.btn.danger:hover { background: rgb(239 68 68 / 0.12); }
.answered { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.answered b { color: var(--text-2); font-weight: 500; }

.plan { border: 1px solid var(--attention-line); border-radius: 12px; background: linear-gradient(var(--attention-soft), var(--attention-soft)), var(--bg); }
.plan.done { border-color: var(--border); background: var(--surface); }
.plan .cx-head { color: var(--attention); }
.plan.done .cx-head { color: var(--muted); }
.plan-body { padding: 2px 14px 4px; }
.plan-body h3 { margin: 0 0 6px; font-size: 14px; color: var(--text); font-weight: 600; }
.plan textarea { display: block; margin: 0 10px; width: calc(100% - 20px); min-height: 64px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: rgb(0 0 0 / 0.35); color: var(--text); resize: vertical; }
.sys { align-self: center; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); }

/* ---------- composer ---------- */
.dock { padding: 0 24px 12px; flex: none; }
.composer { position: relative; max-width: 768px; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: 14px; background: rgb(255 255 255 / 0.025); transition: border-color 0.2s, box-shadow 0.2s; }
.composer:focus-within { border-color: rgb(255 255 255 / 0.22); }
.composer.ultra { border-color: var(--primary-line); box-shadow: 0 10px 44px -18px oklch(0.571 0.21 264 / 0.6); }
.composer.sweep::after { content: ""; position: absolute; inset: -1px; border-radius: 14px; padding: 1px; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, oklch(0.8 0.15 264) 50%, transparent 70%) -100% 0 / 200% 100% no-repeat;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: sweep 0.9s ease-out forwards; }
@keyframes sweep { to { background-position: 200% 0; opacity: 0.2; } }
.composer.drag { border-color: var(--primary); border-style: dashed; }
.drop-hint { position: absolute; inset: 0; border-radius: 14px; display: none; place-items: center; background: rgb(0 0 0 / 0.75); color: var(--primary-text); font-size: 13px; z-index: 2; pointer-events: none; }
.composer.drag .drop-hint { display: grid; }
.att-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
.att-row:empty { display: none; }
.a-chip .rm { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; color: var(--faint); }
.a-chip .rm:hover { background: var(--surface-3); color: var(--text); }
.composer textarea { display: block; width: 100%; min-height: 56px; max-height: 240px; padding: 14px 16px 6px; border: 0; background: transparent; resize: none; outline: none; font-size: 14.5px; line-height: 1.5; color: var(--text); }
.composer textarea::placeholder { color: var(--faint); }
.composer textarea:disabled { cursor: not-allowed; }
.controls { display: flex; align-items: center; gap: 2px; padding: 4px 8px 8px; flex-wrap: wrap; }
.ctl { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 7px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.ctl:hover { background: var(--surface-2); color: var(--text); }
.ctl.icon { width: 28px; padding: 0; justify-content: center; }
.sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex: none; }
.mdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ticks { display: inline-flex; align-items: center; gap: 1.5px; }
.ticks i { width: 5px; height: 8px; background: currentColor; clip-path: polygon(0 0, 100% 50%, 0 100%); }
.ticks i.off { opacity: 0.28; }
.seg-wrap { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); }
.seg button { height: 22px; padding: 0 8px; border-radius: 5px; color: var(--faint); font-size: 12px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface-3); color: var(--text); }
.seg.lit button.on { background: var(--primary-soft); color: var(--primary-text); }
.sw { position: relative; width: 26px; height: 15px; border-radius: 999px; background: var(--surface-3); flex: none; transition: background 0.15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
.on > .sw, .sw.on { background: var(--primary); }
.on > .sw::after, .sw.on::after { transform: translateX(11px); background: #fff; }
.ctl.ultra-on { color: var(--primary-text); }
.ctx { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px; color: var(--muted); font-size: 12px; border-radius: 7px; }
.ctx:hover { background: var(--surface-2); }
.ctx svg { width: 18px; height: 18px; transform: rotate(-90deg); }
.ctx .trk { stroke: var(--surface-3); }
.grow { flex: 1; }
.send { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: #fff; margin-left: 4px; flex: none; }
.send:hover { filter: brightness(1.12); }
.send:disabled { background: var(--surface-2); color: var(--faint); cursor: default; filter: none; }
.send.stop { background: var(--surface-3); color: var(--text); }
.readonly-note { display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: var(--muted); font-size: 12.5px; }
.readonly-note b { color: var(--text-2); font-weight: 500; }

.wsbar { max-width: 768px; margin: 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 2px 0; color: var(--muted); font-size: 12px; min-height: 34px; }
.ws-pick { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 7px; color: var(--text-2); }

.ws-pick .lbl { color: var(--faint); }
.pt { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px 0 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
.pt:hover { border-color: var(--border-strong); color: var(--text); }
.pt.on { border-color: var(--primary-line); background: var(--primary-soft); color: var(--primary-text); }
.pt .sw { width: 22px; height: 13px; }
.pt .sw::after { width: 9px; height: 9px; }
.pt.on .sw::after { transform: translateX(9px); }
.br-input { height: 26px; width: 190px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border); background: transparent; font-family: var(--mono); font-size: 12px; color: var(--text); }
.br-input:focus { border-color: var(--primary-line); outline: none; }
.ws-note { color: var(--faint); font-size: 11.5px; }
.ws-live { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px; color: var(--text-2); }
.ws-live .mono { font-size: 12px; }
.wsbar .grow { flex: 1; }

/* ---------- drawer ---------- */
.drawer { height: 0; overflow: hidden; border-top: 1px solid transparent; transition: height 0.2s ease; flex: none; display: flex; flex-direction: column; }
.drawer.open { height: 230px; border-top-color: var(--border); }
.drawer-tabs { display: flex; align-items: center; gap: 2px; height: 34px; padding: 0 8px; border-bottom: 1px solid var(--border); }
.drawer-tabs .dt { height: 24px; padding: 0 10px; border-radius: 6px; color: var(--muted); font-size: 12px; }
.drawer-tabs .dt.on { background: var(--surface-2); color: var(--text); }
.drawer-tabs .grow { flex: 1; }
.term { flex: 1; overflow: auto; padding: 10px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; color: #cccccc; white-space: pre; }
.term .g { color: #16c60c; } .term .y { color: #f9f1a5; } .term .d { color: #767676; }

/* ---------- board ---------- */
.board-head { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; }
.board-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.board-head .sub { color: var(--faint); font-size: 12.5px; }
.lanes { flex: 1; display: flex; gap: 12px; padding: 16px; overflow: auto; min-height: 0; align-items: flex-start; }
.lane { flex: 1 1 0; min-width: 220px; max-width: 320px; display: flex; flex-direction: column; max-height: 100%; border-radius: 10px; }
.lane-head { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; color: var(--text-2); font-size: 12.5px; font-weight: 500; }
.lane-head .n { color: var(--faint); font-weight: 400; }
.lane-head .add-card { margin-left: auto; color: var(--faint); display: grid; padding: 3px; border-radius: 5px; }
.lane-head .add-card:hover { color: var(--text); background: var(--surface-2); }
.lane-body { display: flex; flex-direction: column; gap: 6px; padding: 4px; min-height: 60px; border-radius: 10px; overflow-y: auto; transition: background 0.15s; }
.lane-body.over { background: var(--surface); }
.lane.start .lane-body { border: 1px dashed var(--primary-line); background: oklch(0.571 0.21 264 / 0.05); min-height: 96px; }
.lane.start .lane-body.over { background: var(--primary-soft); }
.lane-hint { color: var(--primary-text); font-size: 12px; text-align: center; padding: 22px 12px; line-height: 1.45; }
.kcard { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); cursor: grab; text-align: left; width: 100%; }
.kcard:hover { border-color: var(--border-strong); }
.kcard.dragging { opacity: 0.4; }
.kcard .t { color: var(--text); font-size: 13px; line-height: 1.4; }
.kcard .row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.kcard .row:empty { display: none; }
.tag { height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; color: var(--muted); background: var(--surface-3); display: inline-flex; align-items: center; }
.due { height: 20px; padding: 0 6px; border-radius: 5px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); background: var(--surface-3); }
.due.today { color: var(--attention); background: var(--attention-soft); }

.linkchip { height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); background: var(--surface-3); }
.projchip { height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; display: inline-flex; align-items: center; color: var(--primary-text); background: var(--primary-soft); }
.view-switch { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); margin-left: 6px; }
.view-switch button { height: 24px; padding: 0 10px; border-radius: 5px; color: var(--faint); font-size: 12px; }
.view-switch button.on { background: var(--surface-3); color: var(--text); }

.akt { flex: 1; overflow-y: auto; }

.akt h3 { font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 18px 0 8px; display: flex; gap: 8px; }

.akt-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); margin-bottom: 6px; text-align: left; }

// ------------------------------------------------------------------ chat behaviour
function bindChat(chat) {
  const ta = $('#draft');
  if (ta) {
    const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 240) + 'px'; };
    fit();
    ta.addEventListener('input', () => {
      const wasEmpty = !chat.draft.trim();
      chat.draft = ta.value; fit();
      if (!chat.started && chat.ws.branch && !chat.ws.nameTouched) {
        chat.ws.branchName = 'pb/' + slug(chat.draft.split('\n')[0]);
        const bi = $('#br-name'); if (bi) bi.value = chat.ws.branchName;
        refreshWsNote(chat);
      }
      if (wasEmpty !== !chat.draft.trim()) refreshSend(chat);
    });
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(chat); }
    });
    ta.addEventListener('paste', (e) => {
      const files = [...(e.clipboardData?.files || [])];
      if (files.length) { e.preventDefault(); addFiles(chat, files, true); }
    });
  }
  const comp = $('#composer');
  if (comp && chat.mode !== 'external') {
    let depth = 0;
    comp.addEventListener('dragenter', (e) => { if (e.dataTransfer?.types.includes('Files')) { e.preventDefault(); depth++; comp.classList.add('drag'); } });
    comp.addEventListener('dragover', (e) => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault(); });
    comp.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; comp.classList.remove('drag'); } });
    comp.addEventListener('drop', (e) => { e.preventDefault(); depth = 0; comp.classList.remove('drag'); addFiles(chat, [...(e.dataTransfer?.files || [])]); });
  }
  const bi = $('#br-name');
  if (bi) bi.addEventListener('input', () => { chat.ws.branchName = bi.value; chat.ws.nameTouched = true; refreshWsNote(chat); });
}
function refreshSend(chat) { const c = $('#dock'); if (c) { renderComposerOnly(chat); } }
function renderComposerOnly(chat) {
  const dock = $('#dock'); if (!dock) return;
  const ta = $('#draft'); const sel = ta ? [ta.selectionStart, ta.selectionEnd] : null; const had = document.activeElement === ta;
  dock.innerHTML = composerHTML(chat) + wsbarHTML(chat);
  bindChat(chat);
  const nt = $('#draft'); if (nt && had) { nt.focus(); if (sel) nt.setSelectionRange(sel[0], sel[1]); }
}
function refreshWsNote(chat) {
  const note = $('.wsbar .ws-note'); if (!note || chat.started) return;
  const ws = chat.ws;
  const where = ws.worktree ? `.claude/worktrees/${wtName(ws.branchName || chat.draft)}` : 'the main checkout';
  const onBranch = ws.branch ? ws.branchName || 'new branch' : ws.worktree ? `a detached copy of ${ws.base}` : ws.base;
  note.textContent = `Runs in ${where} on ${onBranch}`;
}
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function addFiles(chat, files, pasted) {
  if (!files.length) return;
  for (const f of files) {
    const a = { name: f.name || (pasted ? 'pasted-image.png' : 'file'), kind: (f.type || '').startsWith('image/') ? 'image' : 'file', size: fmtSize(f.size) };
    chat.attachments.push(a);
    if (a.kind === 'image') {
      const r = new FileReader();
      r.onload = () => { a.url = r.result; if (activeChat() === chat) renderComposerOnly(chat); };
      r.readAsDataURL(f);
    }
  }
  renderComposerOnly(chat);
  toast(`${files.length} ${files.length === 1 ? 'file' : 'files'} attached`);
}

function send(chat) {
  if (chat.mode === 'external') return;
  const text = chat.draft.trim();
  if (!text && !chat.attachments.length) return;
  const chips = [];
  if (chat.toggles.codex !== 'off') chips.push('codex:' + chat.toggles.codex);
  if (chat.toggles.ultra) chips.push('ultra');
  const firstSend = !chat.started;
  if (firstSend) {
    chat.started = true;
    const fromCard = chat.prefillCard && cards.find((x) => x.id === chat.prefillCard);
    chat.title = fromCard ? fromCard.title : text.split('\n')[0].slice(0, 48) || 'New chat';
    chat.branch = chat.ws.branch ? (chat.ws.branchName || 'pb/' + slug(text)) : chat.ws.base;
    chat.worktree = chat.ws.worktree ? `.claude/worktrees/${wtName(chat.ws.branchName || text)}` : null;
    if (chat.prefillCard) { const c = cards.find((x) => x.id === chat.prefillCard); if (c) { c.chat = chat.id; chat.card = c.id; } }
  }
  chat.items.push({ k: 'user', text, chips, attachments: chat.attachments.map((a) => ({ ...a })) });
  chat.draft = ''; chat.attachments = [];
  chat.status = 'busy'; chat.when = 'now';
  render();
  if (firstSend) toast(chat.worktree ? `Started in ${chat.worktree} on ${chat.branch}` : `Started on ${chat.branch}`);
  simulateTurn(chat, text);
}
function simulateTurn(chat, text) {
  const log = { k: 'log', open: true, live: true, duration: '', steps: [] };
  chat.items.push(log);
  const steps = [
    { icon: 'search', verb: 'Searched', target: `"${text.split(/\s+/).slice(0, 2).join(' ')}" in src/`, meta: '6 results' },
    { icon: 'file', verb: 'Read', target: 'src/renderer/src/features/chat/Composer.tsx' },
    chat.toggles.codex !== 'off' ? { icon: 'flask', verb: 'Codex', target: 'red tests for the change', meta: '4 tests' } : { icon: 'pencil', verb: 'Edited', target: 'src/renderer/src/features/chat/Composer.tsx', meta: '<span class="add">+12</span> <span class="del">−3</span>' },
    { icon: 'term', verb: 'Ran', target: 'npm test', meta: '316 passed', ok: true }
  ];
  let i = 0;
  const tick = () => {
    if (!chats[chat.id]) return;
    if (i < steps.length) {
      log.steps.forEach((s) => (s.fresh = false));
      log.steps.push({ ...steps[i++], fresh: true });
      if (activeChat() === chat) refreshStream(chat);
      setTimeout(tick, 900);
      return;
    }
    log.live = false; log.open = false; log.duration = '4s';
    const reply = `Done. I looked at how "${text.slice(0, 60)}${text.length > 60 ? '…' : ''}" fits the composer, made the change and the tests pass. The new behaviour is behind the same toggles you used for this message.`;
    const st = { k: 'stream', text: '', done: false };
    chat.items.push(st);
    let n = 0;
    const type = () => {
      n = Math.min(reply.length, n + 6); st.text = reply.slice(0, n);
      if (activeChat() === chat) refreshStream(chat);
      if (n < reply.length) setTimeout(type, 30);
      else { st.done = true; chat.status = 'attention'; chat.when = 'now'; renderSidebar(); renderTabs(); if (activeChat() === chat) { renderView.keepScroll = false; renderView(); } if (state.sound) toast('Chime: a chat needs you'); }
    };
    type();
  };
  setTimeout(tick, 600);
}
function refreshStream(chat) {
  const m = $('#messages'); if (!m) { renderView(); return; }
  const near = m.scrollHeight - m.scrollTop - m.clientHeight < 120;
  m.querySelector('.stream').innerHTML = chat.items.map((it, i) => renderItem(it, chat, i)).join('');
  if (near) m.scrollTop = m.scrollHeight;
}

function newChat(key, prefill) {
  const p = project(key);
  const id = 'n' + uid++;
  chats[id] = {
    id, project: key, title: 'New chat', status: 'idle', mode: 'sdk', model: 'opus', effort: 'xhigh', ctx: 0, tokens: '0', when: 'now',
    card: null, branch: p.branches[0], worktree: null, started: false, toggles: { ...state.defaults },
    draft: prefill?.text || '', attachments: [], items: [], prefillCard: prefill?.card || null,
    ws: { base: p.branches[0], worktree: false, branch: false, branchName: 'pb/' + slug(prefill?.title || 'new-chat'), nameTouched: false }
  };
  (state.tabsOrder[key] ||= []).push(id);
  state.view = { kind: 'project', project: key };
  state.activeTab[key] = id;
  render();
  setTimeout(() => $('#draft')?.focus(), 0);
  return id;
}
function closeChat(id) {
  const c = chats[id]; if (!c) return;
  const order = state.tabsOrder[c.project]; const idx = order.indexOf(id);
  order.splice(idx, 1); delete chats[id];
  if (state.activeTab[c.project] === id) state.activeTab[c.project] = order[Math.max(0, idx - 1)] || 'board';

}

  const draw = () => {
    root.innerHTML = `<div class="modal-bg" data-modal-bg><div class="modal" role="dialog" aria-modal="true" aria-label="Card">

        </div>

    if (!t) return;
    if (t.matches('[data-modal-bg]') && e.target !== t) return;
    if (t.matches('[data-modal-close], [data-modal-bg]')) { root.innerHTML = ''; return; }
    if (t.matches('[data-rmtag]')) { collect(); tags.splice(+t.dataset.rmtag, 1); draw(); return; }
    if (t.matches('[data-card-save]')) { collect(); c.tags = tags; if (!c.title.trim()) c.title = 'Untitled card'; if (isNew) cards.push(c); root.innerHTML = ''; render(); toast(isNew ? 'Card created' : 'Card saved'); return; }
    if (t.matches('[data-card-del]')) { cards.splice(cards.indexOf(c), 1); root.innerHTML = ''; render(); toast('Card deleted'); return; }
    if (t.matches('[data-card-start]')) { collect(); c.tags = tags; if (isNew) cards.push(c); root.innerHTML = ''; startFromCard(c); return; }
    if (t.matches('[data-card-open-chat]')) { root.innerHTML = ''; const ch = chats[c.chat]; if (ch) { state.view = { kind: 'project', project: ch.project }; state.activeTab[ch.project] = ch.id; render(); } else toast('The linked chat resumes when you open it'); return; }
  };
  setTimeout(() => $('#f-title')?.focus(), 0);
}
function startFromCard(c) {
  const doing = 'doing';
  c.col = doing;
  const content = c.body.trim() ? c.body : c.title;
  newChat(c.project, { text: `/cc-enhance ${content}`, card: c.id, title: c.title });
  toast('Chat ready: the prompt is filled in, not sent');
}

// ------------------------------------------------------------------ board drag and drop
function bindBoard() {
  let dragId = null;
  document.querySelectorAll('.kcard').forEach((el) => {
    el.addEventListener('dragstart', (e) => { dragId = el.dataset.kcard; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  });
  document.querySelectorAll('.lane-body').forEach((lane) => {
    lane.addEventListener('dragover', (e) => { if (dragId) { e.preventDefault(); lane.classList.add('over'); } });
    lane.addEventListener('dragleave', () => lane.classList.remove('over'));
    lane.addEventListener('drop', (e) => {
      e.preventDefault(); lane.classList.remove('over');
      const c = cards.find((x) => x.id === dragId); dragId = null; if (!c) return;
      if (lane.dataset.col === 'start-coding') {
        if (c.project === '__global__') { toast('Pick a project for the card first'); return; }
        startFromCard(c); return;
      }
      c.col = lane.dataset.col; render();
    });
  });
}

// ------------------------------------------------------------------ terminal drawer
function renderTerm() {
  const chat = activeChat();
  const cwd = chat ? (chat.worktree ? project(chat.project).path + '\\' + chat.worktree.replace(/\//g, '\\') : project(chat.project).path) : 'C:\\laragon\\www';
  $('#term').innerHTML = state.drawerTab === 'shell'
    ? `<span class="d">PowerShell 7.5</span>\nPS ${esc(cwd)}&gt; npm test\n <span class="g">✓</span> test/shared/context.test.ts <span class="d">(6 tests)</span>\n <span class="g">✓</span> test/main/transcriptParser.test.ts <span class="d">(23 tests)</span>\n <span class="g">✓</span> test/renderer/Composer.test.tsx <span class="d">(14 tests)</span>\n\n Test Files  <span class="g">38 passed</span> (38)\n      Tests  <span class="g">316 passed</span> (316)\n\nPS ${esc(cwd)}&gt; <span class="caret" style="background:#ccc"></span>`
    : `<span class="y">Open in TUI</span> stops the chat here and continues the same session in the Claude Code terminal:\n\n  clauded --resume ${chat ? '72fbbb0f-bd06-4e4a-9886-51532d02ce3a' : '…'}\n\n<span class="d">Use it for things the chat view cannot do yet, like /config or /mcp.\nThe chat picks up again here when you exit the terminal.</span>`;
}
function toggleDrawer(force) {
  state.drawer = force ?? !state.drawer;
  $('#drawer').classList.toggle('open', state.drawer);
  if (state.drawer) renderTerm();
}

// ------------------------------------------------------------------ events
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-tab], [data-proj]');
  if (!t) { if (!e.target.closest('#pop')) closePop(); return; }
  if (!t.closest('#pop') && !t.matches('[data-pop]')) closePop();
  const chat = activeChat();
  const d = t.dataset;
  if (d.ack) { e.stopPropagation(); const c = chats[d.ack]; if (c.status === 'attention') { c.status = 'idle'; toast('Marked as seen'); } else if (c.status === 'idle') { c.status = 'attention'; toast('Marked as unseen'); } renderSidebar(); renderTabs(); if (activeChat() === c) renderView(); return; }
  if (d.close) { e.stopPropagation(); closeChat(d.close); return; }
  if (d.tab) { state.activeTab[state.view.project] = d.tab; renderTabs(); renderView(); if (state.drawer) renderTerm(); return; }
  if (d.proj) {
    if (e.target.closest('[data-act="edit-project"]')) { toast('Opens the project editor (name, base path)'); return; }
    state.view = { kind: 'project', project: d.proj }; $('#app').classList.remove('side-open'); render(); return;
  }
  if (d.pop) { if ($('#pop')) { closePop(); return; } openPop(d.pop, t); return; }
  if (d.setModel) { chat.model = d.setModel; closePop(); renderComposerOnly(chat); renderTabs(); toast(`${model(d.setModel).name}${chat.started ? ' from the next message' : ''}`); return; }
  if (d.setEffort) { chat.effort = d.setEffort; closePop(); renderComposerOnly(chat); renderTabs(); toast(`Effort ${d.setEffort}${chat.started ? ' from the next message' : ''}`); return; }
  if (d.setBase) { chat.ws.base = d.setBase; closePop(); renderComposerOnly(chat); return; }
  if (d.codex) { chat.toggles.codex = d.codex; state.defaults.codex = d.codex; renderComposerOnly(chat); return; }
  if (d.ws) {
    if (d.ws === 'worktree') { chat.ws.worktree = !chat.ws.worktree; if (chat.ws.worktree && !chat.ws.branchTouched) chat.ws.branch = true; }
    else { chat.ws.branch = !chat.ws.branch; chat.ws.branchTouched = true; }
    renderComposerOnly(chat); return;
  }
  if (d.rm !== undefined) { chat.attachments.splice(+d.rm, 1); renderComposerOnly(chat); return; }
  if (d.log !== undefined) { const it = chat.items[+d.log]; it.open = !it.open; renderView.keepScroll = true; const m = $('#messages'); const st = m?.scrollTop; refreshStreamKeep(chat, st); return; }
  if (d.diff !== undefined) { const it = chat.items[+d.diff]; it.open = !it.open; const st = $('#messages')?.scrollTop; refreshStreamKeep(chat, st); return; }
  if (d.pick !== undefined) { const box = t.closest('[data-ask]'); const it = chat.items[+box.dataset.ask]; it.pick = +d.pick; const st = $('#messages')?.scrollTop; refreshStreamKeep(chat, st); return; }
  if ('askSubmit' in d || 'askSkip' in d) {
    const box = t.closest('[data-ask]'); const it = chat.items[+box.dataset.ask];
    const other = box.querySelector('[data-other]').value.trim();
    it.answered = 'askSkip' in d ? 'Skipped' : other || it.options[it.pick].label;
    chat.status = 'busy'; renderSidebar(); renderTabs(); renderView();
    simulateTurn(chat, 'the placement you picked'); return;
  }
  if ('planApprove' in d) { const it = chat.items[+t.closest('[data-plan]').dataset.plan]; it.state = 'approved'; chat.status = 'busy'; renderSidebar(); renderTabs(); renderView(); simulateTurn(chat, it.title); return; }
  if ('planRevise' in d) { const it = chat.items[+t.closest('[data-plan]').dataset.plan]; it.state = 'revising'; refreshStreamKeep(chat, $('#messages')?.scrollTop); setTimeout(() => $('[data-plan-fb]')?.focus(), 0); return; }
  if ('planCancel' in d) { const it = chat.items[+t.closest('[data-plan]').dataset.plan]; it.state = 'pending'; refreshStreamKeep(chat, $('#messages')?.scrollTop); return; }
  if ('planSend' in d) { const box = t.closest('[data-plan]'); const it = chat.items[+box.dataset.plan]; const fb = box.querySelector('[data-plan-fb]').value.trim() || 'Keep planning.'; it.state = 'pending'; chat.items.push({ k: 'user', text: fb, chips: [], attachments: [] }); chat.status = 'busy'; renderSidebar(); renderTabs(); renderView(); simulateTurn(chat, fb); return; }
  if (d.card) { openCard(d.card); return; }
  if (d.kcard) { openCard(d.kcard); return; }
  if (d.newcard) { openCard(null, d.newcard); return; }
  if (d.dt) { state.drawerTab = d.dt; document.querySelectorAll('.drawer-tabs .dt').forEach((b) => b.classList.toggle('on', b.dataset.dt === d.dt)); renderTerm(); return; }
  switch (d.act) {
    case 'new-chat': { const key = state.view.kind === 'project' ? state.view.project : 'pb'; $('#app').classList.remove('side-open'); newChat(key); return; }
    case 'global-board': state.view = { kind: 'global' }; state.globalMode = 'board'; $('#app').classList.remove('side-open'); render(); return;
    case 'aktuelles': state.view = { kind: 'global' }; state.globalMode = 'aktuelles'; $('#app').classList.remove('side-open'); render(); return;
    case 'sound': state.sound = !state.sound; renderSidebar(); return;
    case 'sync': toast('Opens sync settings (Supabase URL, key, account)'); return;
    case 'new-project': toast('Opens the new project dialog'); return;
    case 'side-open': $('#app').classList.add('side-open'); return;
    case 'side-close': $('#app').classList.remove('side-open'); return;
    case 'attach': $('#file-pick').click(); return;
    case 'send': send(chat); return;
    case 'stop': chat.status = 'idle'; renderSidebar(); renderTabs(); renderView(); toast('Stopped'); return;
    case 'ultra': {
      chat.toggles.ultra = !chat.toggles.ultra; state.defaults.ultra = chat.toggles.ultra; renderComposerOnly(chat);
      if (chat.toggles.ultra) { const c = $('#composer'); c.classList.add('sweep'); setTimeout(() => c.classList.remove('sweep'), 950); }
      return;
    }
    case 'drawer': toggleDrawer(); return;
    case 'tui': state.drawerTab = 'tui'; document.querySelectorAll('.drawer-tabs .dt').forEach((b) => b.classList.toggle('on', b.dataset.dt === 'tui')); toggleDrawer(true); return;
  }
});
function refreshStreamKeep(chat, st) { const m = $('#messages'); if (!m) return; m.querySelector('.stream').innerHTML = chat.items.map((it, i) => renderItem(it, chat, i)).join(''); if (st !== undefined) m.scrollTop = st; }
$('#scrim').addEventListener('click', () => $('#app').classList.remove('side-open'));
$('#file-pick').addEventListener('change', (e) => { const chat = activeChat(); if (chat) addFiles(chat, [...e.target.files]); e.target.value = ''; });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#pop')) { closePop(); return; } if ($('#modal-root').innerHTML) { $('#modal-root').innerHTML = ''; return; } const c = activeChat(); if (c && c.status === 'busy' && !c.draft.trim()) { c.status = 'idle'; render(); toast('Stopped'); } return; }
  if (!e.ctrlKey) return;
  if (e.key.toLowerCase() === 'n' && !e.shiftKey) { e.preventDefault(); newChat(state.view.kind === 'project' ? state.view.project : 'pb'); return; }
  if (e.key === '`') { e.preventDefault(); toggleDrawer(); return; }
  if (e.shiftKey && (e.key === 'M' || e.key === 'E')) { const b = $(`[data-pop="${e.key === 'M' ? 'model' : 'effort'}"]`); if (b) { e.preventDefault(); openPop(e.key === 'M' ? 'model' : 'effort', b); } return; }
  if (/^[1-9]$/.test(e.key) && state.view.kind === 'project') { const ids = ['board', ...tabsOf(state.view.project)]; const id = ids[+e.key - 1]; if (id) { e.preventDefault(); state.activeTab[state.view.project] = id; renderTabs(); renderView(); } }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tab[role="button"]')) { e.preventDefault(); e.target.click(); } });
// keep the "live" chat moving so the busy state reads as busy
setInterval(() => {
  const c = chats.c2; if (!c || c.status !== 'busy') return;
  const log = c.items.find((it) => it.live); if (!log || log.steps.length > 7) return;
  const more = [
    { icon: 'pencil', verb: 'Edited', target: 'src/main/sessions/merge.ts', meta: '<span class="add">+18</span> <span class="del">−4</span>' },
    { icon: 'term', verb: 'Ran', target: 'npx vitest run test/main/merge.test.ts', meta: '22 passed', ok: true },
    { icon: 'pencil', verb: 'Edited', target: 'src/renderer/src/features/chat/ChatTabs.tsx', meta: '<span class="add">+9</span> <span class="del">−1</span>' },
    { icon: 'term', verb: 'Ran', target: 'npm run typecheck', meta: 'clean', ok: true },
    { icon: 'term', verb: 'Ran', target: 'npm test', meta: '318 passed', ok: true }
  ];
  const next = more[log.steps.length - 3]; if (!next) return;
  log.steps.forEach((s) => (s.fresh = false)); log.steps.push({ ...next, fresh: true });
  if (activeChat() === c) refreshStream(c);
}, 4000);

render();
</script>
